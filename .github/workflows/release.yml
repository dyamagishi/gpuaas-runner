name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require immutable CUDA base image
        env:
          CUDA_BASE_IMAGE: ${{ vars.CUDA_BASE_IMAGE }}
        run: |
          test -n "$CUDA_BASE_IMAGE"
          echo "$CUDA_BASE_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile
          build-args: CUDA_BASE_IMAGE=${{ vars.CUDA_BASE_IMAGE }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-run-sd-scripts:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Make GHCR package public for RunPod pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/user/packages/container/gpu-run-sd-scripts \
            -d '{"visibility":"public"}'
      - name: Print immutable recipe reference
        run: |
          echo "image digest: ${{ steps.image.outputs.digest }}"
          echo "Update recipes/sdxl-lora.yaml with this digest in a follow-up commit."
