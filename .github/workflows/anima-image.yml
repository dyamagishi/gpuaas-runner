name: Anima image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  anima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require immutable CUDA base image
        env:
          CUDA_BASE_IMAGE: ${{ vars.CUDA_BASE_IMAGE }}
        run: |
          test -n "$CUDA_BASE_IMAGE"
          echo "$CUDA_BASE_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.anima
          build-args: CUDA_BASE_IMAGE=${{ vars.CUDA_BASE_IMAGE }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-run-anima-sd-scripts:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Print immutable recipe reference
        run: |
          echo "anima image digest: ${{ steps.image.outputs.digest }}"
          echo "Update recipes/anima-lora.yaml with this digest in a follow-up commit."
